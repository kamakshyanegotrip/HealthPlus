# HealthPlus pg-boss worker — Fly.io app config (HP-OIR-003 build item 8).
#
# `app` is a placeholder — `fly launch` will prompt to confirm or rename it;
# whatever name you pick there is authoritative, not this file. Region 'bom'
# (Mumbai) matches the Supabase project's ap-south-1, keeping the worker and
# the database in the same metro rather than paying cross-region latency on
# every query — see ADR-003 §2.1's Mumbai reasoning, which applies here too.
app = "healthplus-worker"
primary_region = "bom"

[build]

[processes]
  worker = "npm run start"

# CHANGED (migration 050 / HP-RECON-007): this process now also runs a small
# HTTP listener (src/lib/webhookServer.ts) for the Supabase Storage webhook
# that triggers extractPatientUploadAttributes — see that file's header for
# why. Everything CPU/latency-heavy (Storage download, the Claude vision
# call) still happens asynchronously in the pg-boss job, never in this
# request handler, so this does not reopen ADR-001's "never Vercel
# Functions" reasoning; the webhook receiver's own work is one INSERT and
# one enqueue.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets (DATABASE_URL, DATABASE_URL_DQE, DATABASE_URL_PATIENT_UPLOAD,
# ANTHROPIC_API_KEY, SUBJECT_KEY_WRAPPING_KEY, SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, SUPABASE_STORAGE_WEBHOOK_SECRET) are NOT set
# here — never commit them to this file or to git. Set them with
# `fly secrets set` from your own terminal after `fly launch` creates the
# app; see DEPLOY.md.
