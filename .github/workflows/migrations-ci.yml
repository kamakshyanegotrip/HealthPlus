name: Migrations CI

# Runs the REAL committed migrations (migrations/001..028) against a real
# Postgres 16 + pgvector, then asserts the schema contracts that the
# chat-pipeline stub schema cannot express.
#
# WHY THIS EXISTS, and why it is a separate workflow from chat-pipeline-ci:
#
# chat-pipeline-ci provisions its database from chat-pipeline/db/*.sql — a
# reconstruction of the real schema, written when the real migrations were
# unreachable from that branch (see chat-pipeline/db/STUB_VS_REAL.md). The
# J3-5 reconciliation diffed the two for the first time and found twelve
# divergences, four of which broke running code and one of which was breaking
# it silently: safety.safety_template has no `active` column in the real
# schema, so loadSafetyTemplate()'s query raised, its catch swallowed the
# error, and every CRITICAL/EMERGENCY response would have rendered an
# unapproved hard-coded fallback while the audit row named a template that was
# never displayed.
#
# A reconstruction cannot catch that class of bug, because the reconstruction
# is what is wrong. Only the real migrations can. This workflow is the first
# step of the migration off the stub: it runs the real schema in CI alongside
# the existing job, so drift is caught now, without breaking the pipeline
# tests that currently depend on the stub. The cutover — deleting db/000-020
# and pointing chat-pipeline-ci here — is tracked as R2-R8 in
# HP-RECON-001 and is deliberately not done in the same change.
#
# Verified locally before committing: all 30 migrations apply cleanly to a
# fresh PostgreSQL 16.13 + pgvector, and the contract tests below were checked
# against a negative control — the claim_policy assertion fires when rows are
# deleted, and the c_salt_dies_with_key assertion fires when the constraint is
# dropped. A test that cannot fail proves nothing.

on:
  push:
    branches: [main, hp-integration]
    paths: ['migrations/**', '.github/workflows/migrations-ci.yml']
  pull_request:
    branches: [main]
    paths: ['migrations/**', '.github/workflows/migrations-ci.yml']

jobs:
  migrations:
    name: Apply real migrations + schema contract tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthplus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: healthplus

    steps:
      - uses: actions/checkout@v5

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # Applied in filename order, which is the order they must run in. Any
      # failure stops the job at the first bad file rather than cascading.
      - name: Apply every migration in migrations/ (filename order)
        run: |
          set -euo pipefail
          for f in $(ls migrations/*.sql | sort); do
            echo "--> $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # The point of the whole workflow. These assert Charter guarantees that
      # the stub schema is structurally incapable of representing.
      - name: Schema contract tests
        run: psql -v ON_ERROR_STOP=1 -f migrations/test/schema_contract.test.sql

      # CI-3. Four of the five schema bugs found in the first week of September
      # 2026 were found by executing something against the real schema rather
      # than reading it; the fifth (PR #4) was a query naming a column that does
      # not exist, whose unit test could not catch it because the test's fake
      # encoded the same wrong assumption as the code. This step asks the
      # database instead of a fake. It needs no fixtures and no rows — PREPARE
      # resolves names and types without executing anything.
      #
      # Nine queries are known not to resolve today (the stub-vs-real
      # divergence, HP-RECON-002) and are baselined with a reason apiece. The
      # gate fails on a NEW failure, and also when a BASELINED query starts
      # passing — so the baseline can only shrink, and cannot go stale quietly.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: "SQL query contract — every SQL literal resolves against this schema (CI-3)"
        run: node migrations/test/query_contract.mjs

      # RF6. The alert worker's own path, run against the real schema with a
      # real EMERGENCY event. Two runs, because both outcomes matter and only
      # one of them had ever been exercised:
      #
      #   1. no roster  -> UNDELIVERABLE, exit 2. This is the platform's
      #      current honest state and the run asserts it is REPORTED, not
      #      swallowed. The predecessor to this worker logged and exited 0.
      #   2. roster + a working adapter -> DELIVERED, exit 0, and
      #      red_flag_event.clinician_notified_at actually stamped.
      #
      # If (2) ever stops stamping, RF6 has traded a false positive for a false
      # negative and a real page would go unrecorded.
      # DATA_REGION is now required by the alert worker itself, not just by the
      # app: migration 035's claim is region-scoped and REFUSES to run without
      # it rather than draining an empty batch, so a worker started without a
      # region fails loudly instead of reporting healthy silence on the §4.1
      # path. Same contract src/lib/db.ts has had since SEC-1.
      - name: "RF6 - clinician alert delivery, both outcomes + region-scoped SLA report (worker + schema)"
        env:
          DATA_REGION: IN
        run: |
          set -euo pipefail
          npm --prefix chat-pipeline install pg --no-save --silent
          bash migrations/test/rf6_alert_delivery.sh

      # RF6-claim. R13-roleci found, on its first run, that the alert worker's
      # batch claim could never have executed: `SELECT ... FOR UPDATE` is a write
      # lock and needs UPDATE, which alert_role deliberately does not hold. No
      # §4.1 CRITICAL/EMERGENCY alert was ever deliverable. RF6's own gate above
      # connects as the owner, which is exactly why it passed for four months.
      #
      # Migration 035 moves the claim into a SECURITY DEFINER function. That fix
      # carries its own trap — a DEFINER function runs as the table's owner, and
      # safety.clinician_alert is not FORCE ROW LEVEL SECURITY, so its
      # region-scoping policy does NOT apply inside it. Section 3 of this gate
      # seeds a second region and asserts it is not returned; without the
      # explicit predicate in 035 the worker would silently reach every region.
      - name: "RF6-claim - the worker can claim a batch, in its own region only"
        run: |
          set -euo pipefail
          bash migrations/test/rf6_claim.sh

      # J3-4. The six §6.5 safety metrics, computed against the real schema.
      # Two runs' worth of assertions in one script:
      #
      #   * the four computable metrics produce the numbers a hand calculation
      #     gives, from real rows in response_audit / fabrication_block /
      #     abstention_event / review_queue_item / red_flag_log;
      #   * a quiet day (traffic, zero events) is a COMPUTED 0.0, not a
      #     missing row - §3.0.4 makes abstention a positive metric, and a
      #     positive metric that vanishes at zero cannot do its job;
      #   * red_flag_recall and fabrication_rate_adversarial are recorded
      #     UNCOMPUTABLE with a reason, and the §6.4 release gate BLOCKS.
      #
      # The job exits 2 while any release-gating metric is unmeasurable, which
      # is every run until CL9 produces a clinician-labelled gold set. The
      # script asserts that exit code: a 0 here would be the platform claiming
      # its red-flag recall is known.
      - name: "J3-4 - §6.5 safety metrics computed against the real schema"
        run: |
          set -euo pipefail
          npm install pg --no-save --silent
          bash migrations/test/j34_metrics.sh

      # RF4. The nearest-ED lookup, run against the real schema.
      #
      # The unit tests (test/templateSlots.test.ts) cover the renderer and
      # inject a fake for the facility lookup, so they say nothing about the
      # SQL - a negative control confirmed that deleting
      # `AND has_emergency_department` broke no test that existed. That is
      # PR #4's bug shape: a fake that encodes the same assumption as the code.
      #
      # So this runs the ACTUAL exported function against real rows, with three
      # traps that each WIN the ranking if their guard is dropped: a clinic
      # with no emergency department, an inactive facility, and a facility in
      # the wrong city.
      - name: "RF4 - nearest-ED lookup against the real schema"
        run: |
          set -euo pipefail
          npm --prefix chat-pipeline install tsx pg --no-save --silent
          bash migrations/test/rf4_facility.sh

      # SEC-1. The region boundary, run the way the APPLICATION connects rather
      # than the way a test finds convenient.
      #
      # Migration 031's region policies were verified by a script that ran
      # `SET app.data_region` by hand. The application sets `request.jwt.claims`
      # and nothing else, and no policy in this schema reads that GUC - so
      # every region policy compared a real value to NULL and the 4.0.7 write
      # the pipeline performs on every flagged message was refused.
      #
      # Sections 1-4 check the schema half (the 4.0.8 floor's own boundary, and
      # the composite FK that survives a policy edit). Section 5 is the one that
      # ties the halves together: it imports the REAL exported db() and asserts
      # the write is accepted under its own region and REFUSED under another's.
      # If db.ts stops putting the region on the connection, or hardcodes one,
      # this step goes red - both proven by negative control.
      - name: "SEC-1 - region context and the 4.0.8 floor boundary (app connection + schema)"
        run: |
          set -euo pipefail
          npm --prefix chat-pipeline install tsx pg --no-save --silent
          bash migrations/test/sec1_region_context.sh

      # R10c / HP-DR-003. Retrieval grain, citability, and the domain map.
      #
      # Five of the nine entries in the application's domain map did not
      # resolve against evidence.domain_entity_type when this was written -
      # each would have filtered to zero rows and read as "no evidence on this
      # topic", which is the failure knowledgeLookup.ts already carries a scar
      # from. Section 1 asserts the map READ FROM the module (a copy would
      # drift from the thing it checks); section 2 asserts an unknown entity
      # type RAISES; section 4 runs BOTH fusion strategies over the same rows
      # and asserts they disagree in the predicted direction - shipped picks
      # the Tier 1 guideline, the rejected one picks the Tier 4 brochure.
      - name: "R10c - retrieval grain, citability and the domain map"
        run: |
          set -euo pipefail
          npm --prefix chat-pipeline install tsx pg --no-save --silent
          bash migrations/test/r10c_retrieval.sh

      # R13-conn, decided 8 September 2026 as Option 2: one LOGIN role per
      # worker role, one pool per role.
      #
      # The argument for Option 2 was a SECURITY CLAIM, so section 2 tests the
      # claim rather than the tidiness: no role but redflag_role may write a
      # 4.0.7 safety event. If reasoner_role can, Option 2 bought nothing over
      # Option 3 and migration 034 is decoration.
      #
      # Section 4 covers the class that appeared the moment the roles could log
      # in: reasoner_role held EXECUTE on claim_search and SELECT on nothing
      # claim_search reads. R13 rules A and B were both clean - the role HAD
      # schema USAGE and those tables have no RLS.
      - name: "R13-conn - roles reachable, isolated, and able to do their own work"
        run: |
          set -euo pipefail
          bash migrations/test/r13_conn_isolation.sh

      # R13. The GRANT / RLS contract. R12 audited safety.* only; this is the
      # generalisation, and writing it found the class the earlier two GRANT
      # bugs were instances of: a privilege that CANNOT BE EXERCISED reads
      # exactly like one that can.
      #
      # A grant is real only if the role holds USAGE on the schema, no RLS
      # policy silently denies it, and something can actually BE that role.
      # information_schema shows the privilege either way.
      #
      # 47 findings are baselined with a reason apiece - see
      # grant_contract_baseline.json and HP-JOB-007. Four rules are already
      # clean and stay that way: append-only tables grant no UPDATE/DELETE,
      # reference data grants no writes, nothing holds DELETE, PUBLIC holds
      # nothing. Like CI-3 the baseline can only shrink.
      # C-30, finished. obs.response_audit carried prev_hash/row_hash NOT NULL
      # from migration 001_003 with NOTHING computing them, so the row was
      # unwritable by any means HP-RB-001 permits — the runbook forbids the
      # application to supply a chain value, and no trigger or function supplied
      # one either. The only thing that had ever written the table was
      # j34_metrics.sh, passing eight random bytes to get past the constraint.
      #
      # Migration 036 drops the two columns: C-30 already decided that the chain
      # lives in public.response_audit_event and that this table is a mutable,
      # rebuildable projection. This gate proves BOTH directions, because only
      # one of them is the point — the projection is writable and unchained, AND
      # the event log is still chained, still computes its own hashes (a caller
      # that supplies one is overridden), and is still append-only.
      - name: "C-30 - the audit projection is writable, the event chain is not weakened"
        run: |
          set -euo pipefail
          bash migrations/test/c30_projection.sh

      # R10-key. principal.subject_key has existed since 001_003 and nothing has
      # ever created a row in it — five functions reference the table and every
      # one CONSUMES or DESTROYS a key. obs.response_content.key_id is NOT NULL
      # with an FK to it, so the encrypted response store has never been
      # writable. Migration 038 adds the mint.
      #
      # A migration that makes an ERASURE mechanism usable has to prove the
      # mechanism still works, so §5 is the point: it seeds a real encrypted
      # attribute, reads it back through the audited envelope, erases the
      # subject, and shows the same read returns nothing while the audit
      # projection is unchanged. That is ADR-003 §2.4's crypto-shredding claim
      # and §2.3.4g's audit guarantee executed together — which is what HP-LB-001
      # is being asked to validate.
      - name: "R10-key - the subject key mints, destruction is final, the shred erases"
        run: |
          set -euo pipefail
          bash migrations/test/key_mint.sh

      # R10d-attr. The profile read, as reasoner_role rather than as the owner —
      # and §4 of it is the only check in this repository that does NOT run as a
      # superuser owner.
      #
      # principal.patient_attribute is FORCE ROW LEVEL SECURITY, so its policy
      # applies to the table owner too, and therefore inside
      # fetch_attribute_envelope, which is SECURITY DEFINER. A superuser bypasses
      # RLS regardless — and every migration and gate here runs as `postgres`,
      # which is one. So that boundary has never applied in any test this project
      # has run, while applying in full on a deployment whose owner is not a
      # superuser (the normal Supabase shape). §4 rents that shape for one
      # transaction by reassigning the three objects and the function to a
      # non-superuser role; ALTER ... OWNER is transactional, so ROLLBACK
      # restores them.
      #
      # It also pins the audit_id ordering trap: attribute_access_log.audit_id
      # FKs to obs.response_audit, which is written at the END of a turn, so
      # passing ctx.auditId to the envelope at profile-read time kills the turn.
      - name: "R10d-attr - the profile read path, as the role and under a non-superuser owner"
        run: |
          set -euo pipefail
          bash migrations/test/r10d_attr.sh

      # R10f. The constraint REFUSALS rescued from chat-pipeline/scripts/
      # smoke-test.mjs, which the cutover retires.
      #
      # Five of that file's assertions had no equivalent anywhere in this
      # directory, and they are the valuable kind: each drives a CHECK to its
      # refusal rather than fitting a happy-path row through it. Deleting the
      # stub without porting them would have removed five safety constraints
      # from CI while every other gate stayed green.
      - name: "R10f - the safety constraints refuse what they exist to refuse"
        run: |
          set -euo pipefail
          bash migrations/test/r10f_constraints.sh

      - name: "R13 - GRANT/RLS contract (grants that cannot be exercised)"
        run: |
          set -euo pipefail
          npm install pg --no-save --silent
          node migrations/test/grant_contract.mjs

      # R13-roleci. CI-3 above PREPAREs every SQL literal AS THE OWNER, which
      # answers "does this SQL make sense against this schema?" — a different
      # question from "can this code run?". Against the identical schema, 31 of
      # 39 literals resolve as postgres and 1 of 39 as hp_app (HP-RECON-004 §1).
      # So the gate that was used to SIZE the R10 cutover could not see the
      # class of failure the cutover mostly consists of.
      #
      # This step probes each literal as the role its own module connects as,
      # deriving that role from the db('<pool>') call sites and requiring an
      # explicit declaration for the out-of-process entry points. A file with
      # SQL and no role is a hard error, never a silent default to the owner.
      #
      # It refuses to run unless it can first observe a denial it knows must
      # happen — otherwise a gate that had quietly stopped enforcing anything
      # would report a clean bill of health for a codebase that cannot run.
      #
      # Baseline: 16 today, every one hp_app, each tagged with the item that
      # closes it. Like CI-3's, it may only shrink.
      - name: "R13-roleci - every query, as the role its module connects as"
        run: |
          set -euo pipefail
          node migrations/test/role_contract.mjs

      # Cheap regression guard on the numbering question HP-JOB-002's Ledger
      # left open and this repo answered: nothing should silently reintroduce a
      # gap or a duplicate prefix as the sequence grows.
      - name: Migration numbering is contiguous and unique
        run: |
          set -euo pipefail
          dupes=$(ls migrations/*.sql | sed 's#.*/##' | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "duplicate migration prefixes: $dupes"; exit 1; fi
          echo "highest: $(ls migrations/*.sql | sed 's#.*/##' | sort | tail -1)"
