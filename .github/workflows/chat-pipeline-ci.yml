name: Chat Pipeline CI

# Typecheck, unit tests and the §6.4 eval gate, then the DB-backed suites
# against a real Postgres 16 + pgvector service container — not a mock. No live
# Anthropic call is made anywhere in this workflow; the client is stubbed
# through anthropic.ts's __setAnthropicClientForTesting (see
# chat-pipeline/README.md's honest note on what that leaves untested).
#
# R10g REWROTE THE DB JOB. It used to apply five files from chat-pipeline/db/ —
# a STUB of an upstream schema that did not exist when this pipeline was
# written, and which HP-RECON-001 found had drifted from the real one in twelve
# places. Everything this workflow proved, it proved against that stub. It now
# applies migrations/ and seeds with scripts/seed-real.ts, and the stub is
# deleted. The DB-level smoke test went with it: migrations/test/ covers that
# ground against the real schema and as the real roles, and the five assertions
# it had that nothing else did — all constraint REFUSALS — moved to
# migrations/test/r10f_constraints.sh.
#
# THE ROLES ARE THE POINT OF THE DB JOB. It connects as hp_app, reasoner_role
# and redflag_role, each on its own connection string, because R13-conn's
# guarantee is a runtime property and not a fact about the grant tables. Running
# it as the owner would make it pass while the deployment failed — which is
# exactly what happened to two functions the cutover found (HP-R10-001 §1, §2).
#
# This file lives at the repo root (.github/workflows/) rather than nested under
# chat-pipeline/ — GitHub Actions only discovers workflows there. Because this
# repo holds more than one HealthPlus job, every step runs with its working
# directory pinned to chat-pipeline/, except the schema step, which is one level
# up and says so.

# R10g: `migrations/**` is in the path filter now, and has to be. The DB job
# below applies the real schema, so a migration that breaks the pipeline is a
# change this workflow must run on — under the old filter it would have merged
# green because it touched no file under chat-pipeline/.
on:
  push:
    branches: [main]
    paths: ['chat-pipeline/**', 'migrations/**', '.github/workflows/chat-pipeline-ci.yml']
  pull_request:
    branches: [main]
    paths: ['chat-pipeline/**', 'migrations/**', '.github/workflows/chat-pipeline-ci.yml']

defaults:
  run:
    working-directory: chat-pipeline

jobs:
  typecheck-and-unit:
    name: Typecheck + unit tests + eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chat-pipeline/package-lock.json
      - run: npm ci
      - name: Typecheck (src/ only — see tsconfig.json's include)
        run: npm run typecheck
      - name: Unit tests (pure functions, no DB/network)
        run: npm test
      - name: "§6.4 eval gate (pure functions, no DB/network — see eval/run-eval.ts)"
        run: npm run eval

  db-integration:
    name: Real schema + orchestration integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Plain postgres:16 does not carry the pgvector extension the
        # evidence schema needs (`CREATE EXTENSION vector`, and
        # evidence.retrieval_chunk.embedding is a 384-dim vector) —
        # pgvector/pgvector ships it pre-built on the same postgres:16 base.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hp_test
      # R13-conn: one LOGIN role per worker role, one pool each. hp_app is the
      # role that takes untrusted user input; it cannot read health attributes
      # or write safety rows, and the separate URLs are what make that true at
      # runtime rather than only in the grant tables. Passwords are set by the
      # CI step below, never by a migration — "a password in a migration is a
      # password in git".
      DATABASE_URL: postgres://hp_app:hp_app_pw@localhost:5432/hp_test
      DATABASE_URL_REASONER: postgres://reasoner_role:reasoner_pw@localhost:5432/hp_test
      DATABASE_URL_REDFLAG: postgres://redflag_role:redflag_pw@localhost:5432/hp_test
      # The seed's own OWNER connection. Deliberately not DATABASE_URL: the
      # seed writes to principal, safety and evidence, and hp_app holds INSERT
      # on none of them by design.
      SEED_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hp_test
      DATA_REGION: IN
      # Fixed, non-secret local/CI-only values — never the real deployment
      # secrets. A real deployment supplies these via its own secrets
      # manager (see chat-pipeline/DEPLOY.md); this workflow only ever
      # talks to the ephemeral service-container Postgres above.
      #
      # SUBJECT_KEY_WRAPPING_KEY replaced SUBJECT_HMAC_KEY at R10. The old one
      # was a single process-wide HMAC secret standing in for the per-subject
      # key table; under it erasure deleted nothing, because every pseudonym
      # stayed recomputable from a user_id and one env var. This one wraps a
      # per-subject DEK the database mints, and it must be EXACTLY 32 bytes —
      # subjectKey.ts refuses anything else rather than deriving quietly.
      SUBJECT_KEY_WRAPPING_KEY: 'base64:aGVhbHRocGx1cy1jaS1vbmx5LXdyYXBwaW5nLWtleSE='
      SUPABASE_JWT_SECRET: 'ci-only-dummy-jwt-secret'
      PROMPT_VERSION_COMPOSE: 'compose-2026.08.1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chat-pipeline/package-lock.json
      - run: npm ci
      - name: Create hp_test database
        run: psql -d postgres -c "CREATE DATABASE hp_test;"
      # R10g — THE CUTOVER. This applied five files from chat-pipeline/db/ and
      # now applies migrations/. Those five were a STUB of an upstream schema
      # that did not exist yet when this pipeline was written, and they had
      # drifted from the real one in twelve places (HP-RECON-001). Everything
      # this workflow proved, it proved against the stub.
      #
      # APPLIED WITH psql, NOT migrations/run_migrations.mjs.
      #
      # The runner was tried first and failed on this job's first run:
      #
      #   Error [ERR_MODULE_NOT_FOUND]: Cannot find package 'pg' imported from
      #   /home/runner/work/HealthPlus/HealthPlus/migrations/run_migrations.mjs
      #
      # `npm ci` above installs into chat-pipeline/node_modules, and Node's ESM
      # resolution searches upward from the MODULE's own directory — migrations/
      # — not from the working directory, so it never looks there. Installing pg
      # at the repo root as well would work and would also mean two node_modules
      # trees whose pg versions can drift apart.
      #
      # This is the loop migrations-ci.yml already uses, verbatim. Two workflows
      # applying the same schema by two different mechanisms is how they come to
      # disagree about it, and psql needs nothing installed to run a .sql file.
      - name: Apply the real schema (migrations/, filename order)
        working-directory: .
        run: |
          set -euo pipefail
          for f in $(ls migrations/*.sql | sort); do
            echo "--> $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      # PASSWORDS ARE SET HERE AND NOWHERE ELSE.
      #
      # migrations/034 creates these LOGIN roles and deliberately gives them no
      # password: "a password in a migration is a password in git", and ALTER
      # ROLE ... PASSWORD is cluster-wide, so a migration setting one would
      # change the credential on every database in the cluster including
      # production's. migrations-ci sidesteps the question entirely by using
      # SET SESSION AUTHORIZATION, but this workflow runs the APPLICATION,
      # which connects with a real libpq connection string and cannot.
      #
      # These values are CI-only and the container they apply to is destroyed
      # with the job. A deployment sets them in its own secrets manager.
      - name: Set CI-only passwords on the application login roles
        run: |
          set -euo pipefail
          psql -d hp_test -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE hp_app        WITH PASSWORD 'hp_app_pw';" \
            -c "ALTER ROLE reasoner_role WITH PASSWORD 'reasoner_pw';" \
            -c "ALTER ROLE redflag_role  WITH PASSWORD 'redflag_pw';"
      # R10e — the seed, which is TypeScript rather than SQL because
      # principal.patient_attribute stores ciphertext the application's own key
      # encrypts. A .sql seed can write bytes into those columns but not bytes
      # the pipeline can decrypt, so the fixture is built by the code under
      # test. It also replaces scripts/generate-embeddings.mjs: the seeded
      # retrieval_chunk carries its own 384-dim placeholder embedding.
      #
      # SEED_DATABASE_URL is an OWNER connection and DATABASE_URL is not, and
      # the split is deliberate — hp_app holds INSERT on nothing the seed
      # writes, which is correct and must stay correct (HP-RB-001 §2).
      - name: "Seed the real schema (scripts/seed-real.ts)"
        run: npx tsx scripts/seed-real.ts
      # Both DB-backed suites: the orchestration branches (the real runPipeline,
      # Anthropic mocked) and the profile read decrypted end to end.
      - name: Integration tests against the real schema
        run: npm run test:integration
